  MARCA DA NEPTUNIA: UM ARQUIVO SO, OS DOIS TEMAS, SEMPRE A LOGO LIMPA.

  Ordem do Breno, 25/09/2026: a logo da Neptunia e sempre a escrita limpa,
  sem a figura da mulher no meio; branca no tema escuro, preta no tema claro.

  ORIGEM: .claude/skills/kobalt-neptunia-qtr-contratos-evento/assets/
  logo-neptunia-escrita-preta.svg, no registro canonico (a mesma arte dos
  contratos de evento). O desenho e vetorial, entao aqui nao ha mascara: o
  mesmo caminho, com a cor escrita em CSS.

  COMO A TROCA ACONTECE: prefers-color-scheme, DENTRO do SVG, como em
  mk_logo_tema.svg e deguste_logo_tema.svg. O cockpit escreve color-scheme
  em :root e em .tema-claro, e a consulta de midia do SVG le isso.

  ATENCAO ao editar: comentario XML nao aceita dois hifens seguidos.
-->
