<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 357 87" width="357" height="87" role="img" aria-label="Grancereal">
<!--
  MARCA DA GRANCEREAL COM A ESCRITA: UM ARQUIVO SO, OS DOIS TEMAS.

  ORIGEM: kobalt/contratantes/pessoa-juridica/grancereal/marca/
  grancereal-logo-escrita-24092026.png no registro canonico (357x87, fundo
  transparente), aprovada pelo Breno em D2514 (2026-09-24T13:21:34Z). Spec
  grancereal-fechamento-parcial-robo-conferencia-logo-plano-24092026, secao 2.4.

  O EMBLEMA (o G verde e o trigo dourado, colunas 0 a 83) entra como
  imagem, fixo nos dois temas. A PALAVRA (rancereal, colunas 84 a 356) e
  cinza-escura e sumiria na barra escura: ela vira mascara de luminancia (o alfa
  do recorte) e a cor dela e escrita em CSS, #2B2B2B no claro e #FFFFFF no
  escuro. A separacao e pela coluna: medido em 24/09/2026, nenhum pixel cinza
  escuro esta antes da coluna 84 e nenhum pixel do emblema depois dela.

  COMO A TROCA ACONTECE: prefers-color-scheme DENTRO do SVG, o mesmo molde do
  mk_logo_tema.svg. O cockpit escreve color-scheme em :root e .tema-claro, e o
  img de components/Marca.tsx herda. Nao muda Marca.tsx nem
  lib/marcaContratante.ts.

  ATENCAO ao editar: comentario XML nao aceita dois hifens seguidos.
-->
<style>
  .gc-palavra { fill: #2B2B2B; }
  @media (prefers-color-scheme: dark) { .gc-palavra { fill: #FFFFFF; } }
</style>
<defs>
<mask id="gc-palavra" maskUnits="userSpaceOnUse" x="84" y="0" width="273" height="87"><image x="84" y="0" width="273" height="87" href="data:image/png;base64,"/></mask>
</defs>
<image x="0" y="0" width="84" height="87" href="data:image/png;base64,"/>
<rect class="gc-palavra" x="84" y="0" width="273" height="87" mask="url(#gc-palavra)"/>
</svg>
